controller:
  image:
    repository: "jenkins/jenkins"
    tag: "lts-jdk21"

  admin:
    username: admin
    password: heyjoe

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - docker-workflow
    - job-dsl

  JCasC:
    enabled: true
    defaultConfig: false

    configScripts:
      security: |
        jenkins:
          crumbIssuer:
            standard: {}
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: admin
                  password: heyjoe

          authorizationStrategy:
            loggedInUsersCanDoAnything:
              allowAnonymousRead: false

      clouds: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                retentionTimeout: 10

rbac:
  create: true

serviceAccount:
  create: true
  name: jenkins

