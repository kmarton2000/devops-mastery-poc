apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.com
spec:
  project: default
  sources:
    - repoURL: 'https://charts.jenkins.io'
      chart: jenkins
      targetRevision: 5.8.0
      helm:
        valueFiles:
          - $values/jenkins/values.yaml
    - repoURL: 'https://github.com/kmarton2000/devops-mastery-poc.git'
      targetRevision: feature/setup
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true