apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-server-rolebinding
  namespace: {{ include "devops-suite.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-server-role
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ include "devops-suite.namespace" . }}