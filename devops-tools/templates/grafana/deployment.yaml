apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ include "devops-suite.namespace" . }}
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - containerPort: 3000
              name: web