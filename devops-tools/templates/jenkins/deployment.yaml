apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: {{ include "devops-suite.namespace" . }}
spec:
  replicas: {{ .Values.jenkins.replicaCount }}
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: jenkins
          image: {{ .Values.jenkins.image }}
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 50000
              name: agent
          volumeMounts:
            - name: jenkins-home-volume
              mountPath: /var/jenkins_home
      volumes:
        - name: jenkins-home-volume
          persistentVolumeClaim:
            claimName: jenkins-home-pvc